<!DOCTYPE html>
{% extends 'index.html' %}
{% block content %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Add Book</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">Add Book</h2>

    <form name="addBookForm" method="post" enctype="multipart/form-data" class="p-4 bg-white rounded shadow-sm"
      action="{% url 'save_book' %}" onsubmit="return validateForm()">
      {% csrf_token %}

      <div class="row mb-3">
        <div class="col">
          <label>Title</label>
          <input id="title" type="text" name="title" class="form-control" required>
        </div>
        <div class="col">
          <label>Author</label>
          <input id="author" type="text" name="author" class="form-control" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col">
          <label for="category">Category</label>
          <select name="category" id="category" class="form-control" required>
            <option value="" selected>-- Select Category --</option>
            {% for i in categories %}
            <option value="{{ i.category_name }}">{{i.category_name}}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col">
          <label>Price</label>
          <input id="price" type="number" name="price" class="form-control" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col">
          <label>Publisher</label>
          <input id="publisher" type="text" name="publisher" class="form-control" required>
        </div>
        <div class="col">
          <label>Description</label>
          <textarea id="description" name="description" class="form-control" required></textarea>
        </div>
      </div>

      <div class="mb-3">
        <label>Cover Image</label>
        <input id="img" type="file" name="img" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Add Book</button>
    </form>
  </div>

  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  {% if messages %}
      {% for i in messages %}
          {% if i.tags == 'success' %}
            <script>
              swal(
              '{{i}}','','success'
              )
            </script>
          {% elif i.tags == 'warning' %}
            <script>
              swal(
              '{{i}}','','warning'
              )
            </script>
          {% elif i.tags == 'info' %}
            <script>
              swal(
              '{{i}}','','info'
              )
            </script>
          {% else %}

              swal(
